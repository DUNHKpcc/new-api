name: Backend Quality

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - dev
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare embedded frontend
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
