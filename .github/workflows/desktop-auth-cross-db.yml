name: Desktop Auth Cross-Database

on:
  pull_request:
    paths:
      - "model/desktop_grant*.go"
      - "model/token.go"
      - "service/desktop_authorization*.go"
      - ".github/workflows/desktop-auth-cross-db.yml"
  push:
    branches:
      - dev
    paths:
      - "model/desktop_grant*.go"
      - "model/token.go"
      - "service/desktop_authorization*.go"
      - ".github/workflows/desktop-auth-cross-db.yml"

permissions:
  contents: read

jobs:
  desktop-grant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - mysql
          - postgres
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: newapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run desktop authorization lifecycle
        env:
          TEST_MYSQL_DSN: ${{ matrix.database == 'mysql' && 'root:root@tcp(127.0.0.1:3306)/newapi_test?charset=utf8mb4&parseTime=True&loc=UTC' || '' }}
          TEST_POSTGRES_DSN: ${{ matrix.database == 'postgres' && 'host=127.0.0.1 user=postgres password=postgres dbname=newapi_test port=5432 sslmode=disable TimeZone=UTC' || '' }}
        run: go test -count=1 ./model -run "^TestDesktopGrantLifecycleConfiguredDatabases/${{ matrix.database }}$"
